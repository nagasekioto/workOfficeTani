server:
  # ポート。HTTPSにする場合は 8443 など別のポートにするのが慣例。
  port: ${SERVER_PORT:8080}

  # HTTPS（既定は無効）。
  # 127.0.0.1 だけで待ち受ける運用では通信がこのPCの外に出ないため、
  # HTTPSにしなくても盗聴の危険は無い。自己署名証明書の警告が毎回出る
  # 手間のほうが大きいので、既定は無効にしている。
  # 社内の他PCからも画面を使う運用に変える場合は有効にすること
  # （その場合は COOKIE_SECURE=true も併せて設定する）。
  # 証明書の作り方は scripts\create-https-certificate.ps1 を参照。
  ssl:
    enabled: ${HTTPS_ENABLED:false}
    key-store: ${HTTPS_KEYSTORE:}
    key-store-password: ${HTTPS_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: ${HTTPS_KEY_ALIAS:kaseihu}

  servlet:
    session:
      # セッションIDをURL(;jsessionid=...)に載せない。
      # URLに載ると、ブラウザの履歴・Referer・監査ログ・プロキシのログ等に
      # セッションIDが残り、そこから乗っ取られる恐れがあるためCookieのみにする。
      tracking-modes: cookie
      # 無操作のまま放置されたセッションを自動的に切る。
      # 個人情報の画面を開いたまま離席されると、そのまま操作されてしまうため。
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        # 他サイトから当システムへのリクエストにはCookieを付けない。
        # 細工したページを踏まされたときに /permanent-delete などのPOSTが
        # 外部から発火するのを防ぐ。CsrfInterceptor のOrigin検証と合わせて
        # 二重の防御にしている（どちらか片方だけにしないこと）。
        same-site: strict
        # HTTPS化したときに true にする。
        # 現在はHTTP(localhost)で動いているため true にするとCookieが一切
        # 送られなくなり、ログインできなくなる。既定は false のままにすること。
        secure: ${COOKIE_SECURE:false}

  # 待ち受けアドレス。既定はこのPC自身(127.0.0.1)のみ。
  # 社内の他PCからも画面を使う運用に変える場合は SERVER_ADDRESS=0.0.0.0 を設定する
  # （その場合はファイアウォールで社内サブネットのみに絞ること。
  #   詳細は docs/NETWORK_RESTRICTION.md 第4章・第5章を参照）。
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  datasource:
    # 接続先は環境変数(DB_HOST/DB_PORT/DB_NAME/DB_USER)で上書きできる。
    #
    # パスワードには既定値を置いていない。
    # 既定値に本物のパスワードを書くと、(1)設定し忘れても動いてしまい設定漏れに
    # 気付けない (2)値がリポジトリと全コミット履歴に残り、閲覧できる人全員に知られる、
    # という2つの問題が起きるため。
    # 未設定の場合は、Springの起動処理に入る前に日本語のメッセージを出して停止する
    # (PersonManagementApplication.checkRequiredEnv)。
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kaseihu}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never   # 既存DBを使うので自動DDLはしない

app:
  # --- DBロール分離（対策1: 最小権限の原則）---
  db:
    migration:
      # 起動時のマイグレーション(ALTER TABLE / CREATE TABLE)専用の接続情報。
      #
      # アプリの通常動作は権限を絞ったロール(kaseihu_app)で接続させたいが、
      # DDLにはテーブルの所有者権限が必要なため、そこだけ別のロールを使う。
      #
      # **未設定の場合は通常の接続をそのまま使う（従来と完全に同じ動作）。**
      # 既存の起動方法を壊さないため、あえてフォールバックを残している。
      #
      # ロールの作り方は scripts\create-db-roles.sql を参照。
      username: ${DB_MIGRATION_USER:}
      password: ${DB_MIGRATION_PASSWORD:}

  # --- 監査ログ（誰が・いつ・何を見たか）1-7-7で閲覧 ---
  audit:
    # false にすると記録を停止する。通常は true のままにすること。
    enabled: ${AUDIT_ENABLED:true}
    # ログファイルの出力先。DBのaccess_logsを消されても、ここが残るようにしている。
    # 定期的に別媒体へコピーする運用は /backup-guide（1-7-5）を参照。
    log-dir: ${AUDIT_LOG_DIR:logs/audit}
    # 保持期間（日）。この日数を過ぎたDBレコードとログファイルは自動削除される。
    retention-days: ${AUDIT_RETENTION_DAYS:365}

  auth:
    # ============================================================
    # 認証は Google Authenticator（TOTP）の一本のみ。
    # 共通パスワード方式・メール認証方式は削除した。
    # 設定を1つ変えるだけで二要素認証を迂回できる経路を残さないため。
    #
    # 有効な利用者が1人もいなければ、このPC上(localhost)からのアクセスに限り
    # 初回セットアップ画面が自動的に表示される。
    # 更新して再起動した瞬間に誰も入れなくなる事態を防ぐための仕組み。
    # ============================================================

    # TOTPシークレットを暗号化する鍵。**必ず環境変数で設定すること。**
    # ここに直接書くと、DBと同じ場所に鍵を置くのと同じ意味になり暗号化の意味が消える。
    # 未設定の場合は起動時に警告を出し、ログイン・登録はエラーになる。
    # 紛失時は全利用者のTOTPが復号できなくなるので、紙と別クラウドにも必ず保管すること。
    totp-encryption-key: ${TOTP_ENCRYPTION_KEY:}

    # Google Authenticator のアプリ上に表示されるサービス名
    totp-issuer: ${TOTP_ISSUER:ワークオフィス谷}
