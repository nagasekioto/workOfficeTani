<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>初期画面 - 家政婦紹介事務所</title>
    <link rel="stylesheet" th:href="@{/css/menu.css}">
</head>
<body>
<div class="header">
    <h1><span th:replace="~{fragments/icons :: home}"></span>初期画面</h1>
    <a href="/logout" class="nav-btn logout">ログアウト</a>
</div>
<div class="menu-grid">
    <a href="/person-menu" class="menu-item t-purple">
        <span th:replace="~{fragments/icons :: users}"></span>
        <div class="menu-title">求職者管理</div>
        <div class="menu-no">1-1</div>
    </a>
    <a href="/customer-menu" class="menu-item t-teal">
        <span th:replace="~{fragments/icons :: home}"></span>
        <div class="menu-title">求人者管理</div>

    <a href="/fee-menu" class="menu-item t-amber">

        <div class="menu-title">レジ</div>

    <a href="/other-menu" class="menu-item t-gray wide">
        <span th:replace="~{fragments/icons :: settings}"></span>
        <div class="menu-title">その他</div>
        <div class="menu-no">1-7</div>
    </a>

</html>
