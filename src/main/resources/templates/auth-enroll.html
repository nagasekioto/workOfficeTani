<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>QRコード登録 - ワークオフィス谷</title>
    <style>
        body {
            font-family: 'Segoe UI', Meiryo, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 420px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        ol.steps {
            color: #555;
            font-size: 14px;
            line-height: 1.9;
            padding-left: 20px;
            margin-bottom: 20px;
        }
        .qr-wrap {
            text-align: center;
            margin-bottom: 20px;
        }
        .qr-wrap img {
            width: 220px;
            height: 220px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .secret-box {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }
        .secret-box p {
            margin: 0 0 8px 0;
            color: #666;
            font-size: 13px;
        }
        .secret-value {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #333;
            word-break: break-all;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            letter-spacing: 4px;
            text-align: center;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>&#128241; QRコードを読み取ってください</h1>

        <ol class="steps">
            <li>スマートフォンに <strong>Google Authenticator</strong> をインストールする</li>
            <li>アプリでQRコードを読み取る</li>
            <li>アプリに表示された6桁のコードを下に入力する</li>
        </ol>

        <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="error" th:if="${remainingAttempts != null and remainingAttempts > 0}">
            残り<span th:text="${remainingAttempts}">0</span>回まで試せます。
            これを超えると、はじめから登録をやり直していただきます。
        </div>

        <div class="qr-wrap" th:if="${qrDataUri}">
            <img th:src="${qrDataUri}" alt="QRコード">
        </div>

        <div class="secret-box">
            <p>QRコードが読み取れない場合は、Google Authenticatorの「セットアップキーを入力」で下のキーを手入力してください。</p>
            <div class="secret-value" th:text="${secretBase32}">-</div>
        </div>

        <!-- 対象の利用者はサーバー側のセッションで特定するため、
             userIdやシークレットをフォームで往復させない -->
        <form method="post" action="/auth/enroll/confirm">
            <div class="form-group">
                <label for="code">アプリに表示された6桁のコード</label>
                <input type="text" id="code" name="code" inputmode="numeric" maxlength="6"
                       placeholder="000000" required autofocus>
            </div>
            <button type="submit">確認して登録を完了する</button>
        </form>
    </div>
</body>
</html>
