<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン - ワークオフィス谷</title>
    <style>
        body {
            font-family: 'Segoe UI', Meiryo, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        input[type="text"]:disabled {
            background: #f0f0f0;
            cursor: not-allowed;
        }
        #code {
            letter-spacing: 6px;
            font-family: Consolas, 'Courier New', monospace;
            text-align: center;
            font-size: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #b0b0b0;
            cursor: not-allowed;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        .hint {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 12.5px;
            color: #777;
            line-height: 1.8;
        }
        .hint b { color: #555; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>&#127968; ログイン</h1>

        <div class="error" th:if="${param.error}">
            利用者名またはコードが違います
        </div>

        <div class="error" th:if="${param.locked}">
            ログインに複数回失敗したため、しばらくログインできません。<br>
            <span id="lockCountdown" th:text="${param.locked[0]}"></span>秒後に再度お試しください。
        </div>

        <form method="post" action="/login/totp">
            <div class="form-group">
                <label for="username">利用者名</label>
                <input type="text" id="username" name="username"
                       placeholder="利用者名を入力" required autofocus
                       autocomplete="username"
                       th:disabled="${param.locked}">
            </div>

            <div class="form-group">
                <label for="code">認証コード（6桁）</label>
                <input type="text" id="code" name="code"
                       inputmode="numeric" maxlength="9"
                       placeholder="000000" required
                       autocomplete="one-time-code"
                       th:disabled="${param.locked}">
            </div>

            <button type="submit" th:disabled="${param.locked}">ログイン</button>
        </form>

        <div class="hint">
            <b>認証コードとは</b><br>
            スマートフォンの <b>Google Authenticator</b> に表示されている6桁の数字です。
            30秒ごとに変わります。<br><br>
            <b>スマートフォンが使えないとき</b><br>
            登録時に印刷した<b>バックアップコード</b>（<code>XXXX-XXXX</code> 形式）を、
            同じ欄に入力してください。1つにつき1回だけ使えます。
        </div>
    </div>
<script>
// 二重送信防止：フォーム送信時に送信ボタンを無効化する
document.querySelectorAll('form').forEach(function(form) {
    form.addEventListener('submit', function(e) {
        if (e.defaultPrevented) return;
        var btn = form.querySelector('button[type="submit"], input[type="submit"]');
        if (btn && !btn.disabled) {
            btn.disabled = true;
            if (btn.tagName === 'BUTTON') {
                btn.dataset.origHtml = btn.innerHTML;
                btn.innerHTML = '処理中...';
            }
        }
    });
});

// bfcache（ブラウザの「戻る」で復元された場合）対策：
// 離脱時に無効化されたままのボタンを元に戻す
window.addEventListener('pageshow', function(event) {
    if (event.persisted) {
        document.querySelectorAll('button[type="submit"], input[type="submit"]').forEach(function(btn) {
            btn.disabled = false;
            if (btn.tagName === 'BUTTON' && btn.dataset.origHtml) {
                btn.innerHTML = btn.dataset.origHtml;
            }
        });
    }
});

// ロック中のカウントダウン表示（1秒ごとに残り秒数を減らす）
var countdownEl = document.getElementById('lockCountdown');
if (countdownEl) {
    var remaining = parseInt(countdownEl.textContent, 10);
    var timer = setInterval(function() {
        remaining--;
        if (remaining <= 0) {
            clearInterval(timer);
            // ロック解除：入力欄・ボタンを有効化してエラーメッセージを消す
            document.querySelectorAll('#username, #code').forEach(function(el) { el.disabled = false; });
            var submitBtn = document.querySelector('button[type="submit"]');
            if (submitBtn) submitBtn.disabled = false;
            var errorBox = countdownEl.closest('.error');
            if (errorBox) errorBox.style.display = 'none';
        } else {
            countdownEl.textContent = remaining;
        }
    }, 1000);
}
</script>
</body>
</html>
