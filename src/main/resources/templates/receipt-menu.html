<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>領収書作成 - 家政婦紹介事務所</title>
    <link rel="stylesheet" th:href="@{/css/menu.css}">
</head>
<body class="menu-pink">
<div class="header">
    <h1><span th:replace="~{fragments/icons :: receipt}"></span>領収書作成（1-5）</h1>
    <a href="/menu" class="nav-btn"><span th:replace="~{fragments/icons :: arrowleft}"></span>初期画面に戻る</a>
</div>
<div class="menu-grid">
    <a href="/receipt-menu/customer-receipt" class="menu-item">
        <span th:replace="~{fragments/icons :: receipt}"></span>
        <div class="menu-title">求人者宛領収書</div>
        <div class="menu-no">1-5-1</div>
        <div class="menu-sub">求人受付手数料の領収書</div>
    </a>
    <a href="/receipt-menu/jobseeker-receipt" class="menu-item">
        <span th:replace="~{fragments/icons :: coin}"></span>
        <div class="menu-title">求職受付手数料領収書</div>
        <div class="menu-no">1-5-2</div>
        <div class="menu-sub">求職者受付手数料の領収書</div>
    </a>
    <a href="/receipt-menu/issued-list" class="menu-item">
        <span th:replace="~{fragments/icons :: list}"></span>
        <div class="menu-title">発行済み領収書一覧</div>
        <div class="menu-no">1-5-3</div>
        <div class="menu-sub">1-5-1 / 1-5-2 の発行済み領収書を月単位で確認</div>
    </a>
    <a href="/receipt-menu/delete" class="menu-item wide danger">
        <span th:replace="~{fragments/icons :: trash}"></span>
        <div class="menu-title">領収書削除</div>
        <div class="menu-no">1-5-4</div>
        <div class="menu-sub">※ テスト時のみ使用 — 発行済み領収書の番号をリセット・削除します</div>
    </a>
</div>
</body>
</html>
