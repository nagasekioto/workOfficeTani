<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  ============================================================
   メニュー画面のアイコン定義（1箇所に集約）

   【なぜSVGなのか】
   以前は絵文字（&#128084; 等）を使っていたが、絵文字はWindowsの
   バージョンやフォント設定で形・色・太さが変わり、並べたときに揃わない。
   SVGなら環境によらず同じ見た目になる。

   【なぜCDNのアイコンフォントを使わないのか】
   このシステムは1台のPCで動かす想定で、インターネットが無い環境でも
   崩れないようにするため。外部から読み込まない。

   【なぜフラグメントにしたのか】
   同じSVGを8つのテンプレートに書くと、1つ直すのに8箇所直すことになる。

   【使い方】
     <span th:replace="~{fragments/icons :: users}"></span>

   色は stroke="currentColor" なので、CSSの color がそのまま反映される
   （menu.css の --accent-icon で画面ごとに変わる）。
  ============================================================
-->
<body>

<svg th:fragment="users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.2 20c0-3.3 2.6-5.6 5.8-5.6s5.8 2.3 5.8 5.6"/><path d="M16.6 6.3a3 3 0 0 1 0 5.4"/><path d="M18.2 14.8c1.7.7 2.6 2.5 2.6 5.2"/></svg>

<svg th:fragment="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M6 10.2V20h12v-9.8"/><path d="M10 20v-5.8h4V20"/></svg>

<svg th:fragment="coin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M9 7.2 12 11l3-3.8"/><path d="M12 11v5.8"/><path d="M9.2 12.4h5.6"/><path d="M9.2 14.6h5.6"/></svg>
